# Build strata-dsv41 for sm_75 (Turing: RTX 20 / T4 / RTX 8000, 含 16GB Tesla T10)
# 基于 jankais3r/dsv41-sm70 的 CI 改造: 只保留 Windows job, 源码用 Niko1221/Strata 官方 tag,
# arch 75-real, 无 Pascal 补丁 (#4176/#4273 证实 sm_75 无需改源码)。
# 用法: 在 GitHub 上 Fork 本仓库(任何空仓库亦可) → 把本文件放到 .github/workflows/ →
#       Actions 里 Run workflow (source_ref 默认 v0.2.14) → 下载 artifact 里的 tar.gz。
name: Build strata-dsv41 for sm_75

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Strata 源码 tag (需与本机 Strata 版本的引擎版本对应)"
        required: false
        default: "v0.2.13"

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: Niko1221/Strata

jobs:
  windows:
    name: Windows x86-64 / CUDA 13.0 / sm_75
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Check out the requested source tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref || 'v0.2.13' }}
          path: source
          persist-credentials: false
          submodules: recursive

      - name: Record source commit
        working-directory: source
        shell: pwsh
        run: |
          git rev-parse HEAD | Tee-Object -FilePath ..\SOURCE_COMMIT.txt

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA 13.0.0
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.0.0"
          method: local

      - name: Install Python packaging dependency
        shell: pwsh
        run: |
          python -m pip install cryptography
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

      - name: Configure and build
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          nvcc --version
          if ($LASTEXITCODE -ne 0) { throw "nvcc is unavailable" }

          cmake -S . -B build-dsv41 -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DSTRATA_ENABLE_CUDA=ON" `
            "-DSTRATA_BUILD_TESTS=OFF" `
            "-DSTRATA_BUILD_DSV41=ON" `
            "-DSTRATA_NATIVE_EXPERTS=ON" `
            "-DSTRATA_PORTABLE=ON" `
            "-DCMAKE_CUDA_ARCHITECTURES=75-real" `
            "-DCMAKE_CUDA_RUNTIME_LIBRARY=Shared" `
            "-DCUDAToolkit_ROOT=$env:CUDA_PATH" `
            "-DCMAKE_CUDA_COMPILER=$env:CUDA_PATH/bin/nvcc.exe"

          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }

          cmake --build build-dsv41 --target strata-dsv41 --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          if (-not (Test-Path "build-dsv41/strata-dsv41.exe")) {
            throw "The expected executable was not produced"
          }

      - name: Check that the executable contains sm_75 code
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dump = & cuobjdump --list-elf "build-dsv41/strata-dsv41.exe"
          if ($LASTEXITCODE -ne 0) { throw "cuobjdump failed" }

          $dump | Set-Content -Encoding utf8 "cuobjdump-elf.txt"
          $dump | Write-Host

          if (-not (($dump -join "`n") -match "sm_75")) {
            throw "cuobjdump did not find an sm_75 ELF image"
          }

      - name: Collect DLLs and create tarball
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cmakeText = Get-Content -Raw "CMakeLists.txt"
          if ($cmakeText -notmatch '(?i)project\s*\(\s*strata\s+VERSION\s+([0-9.]+)') {
            throw "Could not determine the Strata version"
          }
          $version = $Matches[1]
          Write-Host "Engine version: $version"

          New-Item -ItemType Directory -Force stage, packages, dist |
            Out-Null

          Copy-Item "build-dsv41/strata-dsv41.exe" "stage/"
          Copy-Item "cuobjdump-elf.txt" "dist/"
          Copy-Item "..\SOURCE_COMMIT.txt" "dist/SOURCE_COMMIT.txt"

          # package_engine.py scans PE imports and copies missing DLLs
          # from CUDA_PATH and PATH into the package.
          python packaging/package_engine.py `
            --src stage `
            --backend cuda `
            --version $version `
            --platform windows-x86_64 `
            --variant cuda13 `
            --arch sm_75 `
            --min-driver nvidia=580.65 `
            --build-id (Get-Content ..\SOURCE_COMMIT.txt) `
            --entrypoint strata-dsv41.exe `
            --out packages

          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }

          $packageDir = "packages/$version-windows-x86_64-cuda-cuda13"

          python packaging/package_engine.py --verify $packageDir
          if ($LASTEXITCODE -ne 0) { throw "Package verification failed" }

          python packaging/feed_tool.py pack-engine `
            $packageDir `
            --out dist `
            --prefix strata-dsv41 `
            --url-prefix=

          if ($LASTEXITCODE -ne 0) { throw "Tarball creation failed" }

          $archives = @(Get-ChildItem "dist/*.tar.gz")
          if ($archives.Count -ne 1) {
            throw "Expected exactly one tar.gz archive"
          }

          $hash = Get-FileHash -Algorithm SHA256 $archives[0].FullName
          "$($hash.Hash.ToLower())  $($archives[0].Name)" |
            Set-Content -Encoding ascii "dist/SHA256SUMS.txt"

          Get-ChildItem dist

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: strata-dsv41-windows-x86_64-cuda13-sm75
          retention-days: 3
          path: |
            source/dist/*.tar.gz
            source/dist/*.entry.json
            source/dist/SHA256SUMS.txt
            source/dist/SOURCE_COMMIT.txt
            source/dist/cuobjdump-elf.txt
          if-no-files-found: error
